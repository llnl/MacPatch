# MacPatch log rotation (macOS), installed to /etc/newsyslog.d/macpatch.conf
#
# Gunicorn (API & Console) access/error logs and the API & Console app logs.
# These are written by several gunicorn worker processes, so they are rotated
# here and not by the apps. The apps use WatchedFileHandler, which re-opens a
# log file once it has been rotated, no signal is needed (N flag).
#
# Rotated daily at midnight ($D0) or when larger than 100 MB, 30 archives kept.
# G = file name is a pattern, J = bzip2 archives, N = no signal
#
# logfilename                                owner:group      mode count size    when  flags
/opt/MacPatch/Server/logs/g_console_*.log    _appserver:_www  664  30    102400  $D0   GJN
/opt/MacPatch/Server/logs/g_api_*.log        _appserver:_www  664  30    102400  $D0   GJN
/opt/MacPatch/Server/logs/gMPConsole_*.log   _appserver:_www  664  30    102400  $D0   GJN
/opt/MacPatch/Server/logs/gMPAPI_*.log       _appserver:_www  664  30    102400  $D0   GJN
/opt/MacPatch/Server/apps/logs/*.log         _appserver:_www  664  30    102400  $D0   GJN
