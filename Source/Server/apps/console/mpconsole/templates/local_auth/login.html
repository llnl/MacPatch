<!DOCTYPE html>
<html lang="en">

<head>
	{% include 'includes/login_top_level.html' %}

	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="">
	<meta name="author" content="">

	<title>MacPatch - Admin Console</title>

	<!-- Bootstrap 5.3 + SB Admin 2 -->
	<link href="{{ url_for('static', filename='css/sb-admin-2-bs5.min.css') }}" rel="stylesheet">

	<!-- Custom Fonts -->
	<link href="{{ url_for('static', filename='yarn_components/@fortawesome/fontawesome-free/css/all.min.css') }}" rel="stylesheet" type="text/css">
	<link href="{{ url_for('static', filename='yarn_components/@fortawesome/fontawesome-free/css/v4-shims.min.css') }}" rel="stylesheet" type="text/css">

	<!-- Custom CSS -->
	<link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">

	<link href="{{ url_for('static', filename='css/bootstrap4-compat.css') }}" rel="stylesheet">
	<meta name="csrf-token" content="{{ csrf_token() }}">
</head>

<body>
	<div class="container">
		<div class="row">
			<div class="col-md-4 offset-md-4">
				<div class="login-panel panel panel-default">
					<div class="panel-heading text-center">
						<img class="mx-auto d-block" src="{{ url_for('static', filename='img/mp_3_icon_90.png') }}" />
						<h4 class="mx-auto d-block">MacPatch Admin Console</h4>
					</div>
					<div class="panel-body">
						<br>
						<form role="form" action="" method="post">
							{{form.hidden_tag()}}
							<fieldset>
								<div class="form-group">
									<input class="form-control" placeholder="Username" name="username" type="username" autofocus>
								</div>
								<div class="form-group">
									<input class="form-control" placeholder="Password" name="password" type="password" value="">
								</div>
								<input class="btn btn-lg btn-login-alt w-100" type="submit" value="Login">
							</fieldset>
						</form>
					</div>
					<div class="panel-footer text-center">
						<a href="/agent/download">
							<h5>Client Download</h5>
						</a>
					</div>
				</div>
			</div>
		</div>
			<div class="row">
				<div class="col-md-4 offset-md-4">
					<article class="flashes">
						{% with messages = get_flashed_messages() %}
						  {% if messages %}
							<ul>
							{% for message in messages %}
							  <li>{{ message }}</li>
							{% endfor %}
							</ul>
						  {% endif %}
						{% endwith %}
					</article>
				</div>
			</div>

	</div>

	<!-- jQuery -->
	<script src="{{ url_for('static', filename='yarn_components/jquery/dist/jquery.min.js') }}"></script>
	<script src="{{ url_for('static', filename='static_components/macpatch/session-navigation.js') }}"></script>

	<!-- Bootstrap Core JavaScript -->
	<script src="{{ url_for('static', filename='static_components/bootstrap5/bootstrap.bundle.min.js') }}"></script>


</body>

</html>
