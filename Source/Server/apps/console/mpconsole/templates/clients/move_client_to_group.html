<form method="post" action="/clients/move/client" id="client-group-move-form" class="client-group-modal-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="cuuid" value="{{ cuuid or '' }}">
    <input type="hidden" name="orig_group_id" value="" id="orig_group_id">
    <input type="hidden" name="cuuids" value="" id="cuuids">
    <div class="form-group">
        <label>Current Group</label>
        <p id="currentGroupName" class="mb-0">{% for group in groups %}{% if group.group_id == curGroup %}{{ group.group_name }}{% endif %}{% endfor %}</p>
    </div>
    <div class="form-group">
        <label for="client-move-group">New Group</label>
        <select id="client-move-group" class="form-control" name="group_id" required>
            {% for group in groups %}
            {% if group.group_id != curGroup %}<option value="{{ group.group_id }}">{{ group.group_name }}</option>{% endif %}
            {% endfor %}
        </select>
    </div>
    <div class="client-group-modal-actions">
        <button type="button" class="btn btn-default" data-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Move</button>
    </div>
</form>
<script>
    $('#modalSaveButton').off('click.clientGroupForm').on('click.clientGroupForm', function () {
        document.getElementById('client-group-move-form').requestSubmit();
    });
</script>
