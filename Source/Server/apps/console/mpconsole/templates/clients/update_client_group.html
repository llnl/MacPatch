<form method="post" action="/clients/group/update/NA" id="client-group-edit-form" class="client-group-modal-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="group_id" value="{{ data.group_id or '' }}">
    <div class="form-group">
        <label for="client-group-name">Client Group Name</label>
        <input id="client-group-name" class="form-control" type="text" name="group_name" value="{{ data.group_name or '' }}" required>
    </div>
    <div class="form-group">
        <label for="client-group-owner">Client Group Owner</label>
        <input id="client-group-owner" class="form-control" type="text" name="group_owner" value="{{ data.group_owner or '' }}" required>
    </div>
    <div class="client-group-modal-actions">
        <button type="button" class="btn btn-default" data-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">{{ 'Add' if type == 'add' else 'Save' }}</button>
    </div>
</form>
<script>
    $('#modalSaveButton').off('click.clientGroupForm').on('click.clientGroupForm', function () {
        document.getElementById('client-group-edit-form').requestSubmit();
    });
</script>
