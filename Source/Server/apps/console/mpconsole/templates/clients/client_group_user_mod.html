<form method="post" action="/clients/group/user/modify" id="client-group-user-form" class="client-group-modal-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="group_id" value="{{ data.group_id or '' }}">
    <div class="form-group">
        <label for="client-group-user-id">User ID</label>
        <input id="client-group-user-id" class="form-control" type="text" name="user_id" value="{{ data.group_admin or '' }}" required>
    </div>
    <div class="client-group-modal-actions">
        <button type="button" class="btn btn-default" data-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">{{ 'Add' if type == 'add' else 'Update' }}</button>
    </div>
</form>
