{% extends "base.html" %}

{% block styles %}
	{{ super() }}
	<link href="{{ url_for('static', filename='yarn_components/bootstrap-table/dist/bootstrap-table.css') }}" rel="stylesheet">
	<link href="{{ url_for('static', filename='css/bootstrap-table-editable.css') }}" rel="stylesheet">
	<link href="{{ url_for('static', filename='yarn_components/@selectize/selectize/dist/css/selectize.css') }}" rel="stylesheet">
	<link href="{{ url_for('static', filename='css/client-group-modals.css') }}" rel="stylesheet">
	<link href="{{ url_for('static', filename='css/mp.css') }}" rel="stylesheet">
{%  endblock %}

{% block pageHeader %}
Client Groups
{%  endblock %}

{% block bodyPanel %}
	<div id="client-groups-table-container">
		<div id="toolbar">
			<button id="addButton" type="button" class="btn btn-default"><i class="glyphicon glyphicon-plus"></i></button>
		</div>
		<table id="table" data-toolbar="#toolbar" class="table table-bordered table-sm table-striped" data-show-export="true"></table>
	</div>
{% endblock %}


{% block javascript %}
	{{ super() }}
	<script src="{{ url_for('static', filename='yarn_components/@selectize/selectize/dist/js/selectize.min.js') }}"></script>
	<script src="{{ url_for('static', filename='static_components/macpatch/client-group-modals.js') }}"></script>
	<script src="{{ url_for('static', filename='yarn_components/bootstrap-table/dist/bootstrap-table.min.js') }}"></script>
	<script src="{{ url_for('static', filename='static_components/bootstrap-table-editable/bootstrap-table-editable.js') }}"></script>
	<script src="{{ url_for('static', filename='yarn_components/bootstrap-editable/js/index.js') }}"></script>
	<script src="{{ url_for('static', filename='static_components/macpatch/bootstrap4-editable.js') }}"></script>
	<script>
	(function () {
		var rights = {{ rights | tojson }}.map(String);
		var currentUser = {{ session.user | tojson }};
		var isAdmin = Number({{ session.role[0] | tojson }}) === 1;

		var counts = {};
		{{ counts | tojson }}.forEach(function (c) { counts[c.group_id] = c.total; });

		var rows = {{ data | tojson }}.map(function (g) {
			g.count = counts[g.group_id] || 0;
			return g;
		});

		function isDefault(row)    { return row.group_name === 'Default'; }
		function hasRowRight(row)  { return isDefault(row) || rights.indexOf(String(row.group_id)) > -1; }
		function canRemove(row)    { return !isDefault(row) && (row.group_owner === currentUser || isAdmin); }

		var table = MPTable.create('#table', {
			idField: 'group_id',
			sortName: 'count',
			sortOrder: 'desc',
			pageList: ['10', '25', '50', '100', 'All'],
			size: 'lg',
			columns: [
				{% for col in columns %}
				{ field: {{ col.name | tojson }}, title: {{ col.info | tojson }}, sortable: true{% if col.name == 'rid' or col.name == 'group_id' %}, visible: false{% endif %} },
				{% endfor %}
				{ field: 'count', title: 'No. Clients', sortable: true }
			],
			data: rows,
			actions: [
				{ name: 'edit', icon: 'fa-pencil', title: 'Edit Client Group',
				  show: hasRowRight, showDisabled: true,
				  onClick: function (row) { window.location.href = '/clients/group/' + encodeURIComponent(row.group_id); } },
				{ name: 'modify', icon: 'fa-edit', title: 'Modify Client Group',
				  show: hasRowRight, showDisabled: true,
				  onClick: function (row) {
					ClientGroupModals.load('/clients/group/modify/' + encodeURIComponent(row.group_id), {title: 'Edit Client Group'});
				  } },
				{ name: 'remove', icon: 'fa-trash-o', title: 'Remove Client Group',
				  show: canRemove, showDisabled: true,
				  onClick: removeGroup }
			]
		});

		function removeGroup(row) {
			if (!confirm('Are you sure you want to delete this client group (' + row.group_name + ') ?')) return;

			MPHttp.delete('/clients/group/' + encodeURIComponent(row.group_id))
				.then(function () { table.removeRow('group_id', row.group_id); })
				.catch(function (err) {
					ClientGroupModals.open({
						title: 'Error, Removing Client Group',
						content: $('<p>').text(MPHttp.errorMessage(err)),
						footer: true,
						danger: true
					});
				});
		}

		document.getElementById('addButton').addEventListener('click', function () {
			ClientGroupModals.load('/clients/group/add', {title: 'Add Client Group'});
		});
	}());
	</script>
{% endblock %}
