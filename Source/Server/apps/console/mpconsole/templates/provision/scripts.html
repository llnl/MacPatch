{% extends "base.html" %}

{% block styles %}
	{{ super() }}
	<link href="{{ url_for('static', filename='yarn_components/bootstrap-table/dist/bootstrap-table.css') }}" rel="stylesheet">
	<link href="{{ url_for('static', filename='css/mp.css') }}" rel="stylesheet">
{%  endblock %}

{% block pageHeader %}
<div class="container-fluid">
	<div class="float-start">Provisioning - Scripts</div>
	<div class="float-end">
		<button type="button" class="btn btn-primary" data-bs-container="body" data-bs-toggle="popover"
				data-bs-placement="left"
				data-bs-content="Provisioning scripts, have two types - Pre and Post. The scripts will run before required software and after required software has been installed.">
		  <i class="fa fa-question"></i>
		</button>
	</div>
</div>
{%  endblock %}

{% block bodyPanel %}

	<div id="toolbar">
		{% if session.role[0] == 1 %}
		<button id="addButton" type="button" class="btn btn-default" title="New Software Task"><i class="fa fa-plus"></i></button>
		<button id="deleteButton" type="button" class="btn btn-default" title="Delete Software Task"><i class="fa fa-trash"></i></button>
		{% endif %}
	</div>
	<table id="table" class="table table-bordered table-sm table-striped"></table>

{% endblock %}


{% block javascript %}
	{{ super() }}
	<script src="{{ url_for('static', filename='yarn_components/bootstrap-table/dist/bootstrap-table.min.js') }}"></script>
	<script>
	$( document ).ready(function()
	{
		$('[data-bs-toggle="popover"]').popover();

		var isAdmin = {{ (session.role[0] == 1) | tojson }};

		var table = MPTable.create('#table', {
			url: "/provision/scripts/list",
			toolbar: '#toolbar',
			showRefresh: true,
			sortName: 'order',
			idField: 'sid',
			checkbox: isAdmin,
			size: 'lg',
			actions: isAdmin ? [
				{ name: 'edit', icon: 'fa-pencil', title: 'Edit',
				  onClick: function (row) {
					$.get("/provision/script/edit/" + encodeURIComponent(row['sid'])).done(function(data) {
						resetModalWindow();
						$('#modalTitle').html('New Provisioning Script');
						$('#modalCancelButton').html('Cancel');
						$('#modalBody').html(data);
						$('#modalDialog').addClass("modal-wide");
						$('#modalDialog').modal('show');
					});
				  } }
			] : [],
			columns: [
			{% for col in columns %}
			{ field: {{ col.field | tojson }}, title: {{ col.title | tojson }}{% if col.visible == false %}, visible: false{% endif %}, sortable: true },
			{% endfor %}
			]
		});

		$('#deleteButton').click(function () {
			var rowsArr = table.selectedIds('sid');

			$.ajax({
				url: "/provision/script/remove",
				type: 'DELETE',
				cache: false,
				data: {'sids':rowsArr.toString()},
				error: function (request, status, error)
				{
					var jsonValue = jQuery.parseJSON( request.responseText );
					alert(jsonValue.errormsg);
				},
				success: function () {
					table.removeRows('sid', rowsArr);
					alert("Script(s) removed successfully.");
				}
			});
		});

		$('#addButton').click(function () {
			$.get("/provision/script/new").done(function(data)
			{
				resetModalWindow();
				$('#modalTitle').html('New Provisioning Script');
				$('#modalCancelButton').html('Cancel');
				$('#modalBody').html(data);
				$('#modalBody').css({'height':'60vh'});
				$('#modalDialog').addClass("modal-wide");
				$('#modalDialog').modal('show');

				$("#modalDialog").on("hidden.bs.modal", function () {
					table.refresh();
				});
			});
		});
	});
	</script>
{% endblock %}
