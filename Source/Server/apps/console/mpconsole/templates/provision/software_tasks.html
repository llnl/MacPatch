{% extends "base.html" %}

{% block styles %}
	{{ super() }}
	<link href="{{ url_for('static', filename='yarn_components/bootstrap-table/dist/bootstrap-table.css') }}" rel="stylesheet">
	<link href="{{ url_for('static', filename='css/mp.css') }}" rel="stylesheet">
{%  endblock %}

{% block pageHeader %}
	Provisioning - Required Software
{%  endblock %}

{% block bodyPanel %}

	<div id="toolbar">
		{% if session.role[0] == 1 %}
		<button id="addButton" type="button" class="btn btn-default" title="New Software Task"><i class="glyphicon glyphicon-plus"></i></button>
		<button id="deleteButton" type="button" class="btn btn-default" title="Delete Software Task"><i class="glyphicon glyphicon-trash"></i></button>
		{% endif %}
	</div>
	<table id="table" class="table table-bordered table-sm table-striped"></table>

{% endblock %}


{% block javascript %}
	{{ super() }}
	<script src="{{ url_for('static', filename='yarn_components/bootstrap-table/dist/bootstrap-table.min.js') }}"></script>
	<script>
	$( document ).ready(function()
	{
		var isAdmin = {{ (session.role[0] == 1) | tojson }};

		var table = MPTable.create('#table', {
			url: "/provision/tasks/list",
			toolbar: '#toolbar',
			showRefresh: true,
			pageList: ['10', '25', '50', '100', 'All'],
			idField: 'tuuid',
			checkbox: isAdmin,
			size: 'lg',
			actions: isAdmin ? [
				{ name: 'edit', icon: 'fa-pencil', title: 'Edit',
				  onClick: function (row) {
					$.get("/provision/task/edit/" + encodeURIComponent(row['tuuid'])).done(function(data)
					{
						resetModalWindow();
						$('#modalTitle').html('New Provisioning Software Task');
						$('#modalCancelButton').html('Cancel');
						$('#modalBody').html(data);
						$('#modalDialog').addClass("modal-wide");
						$('#modalDialog').modal('show');
					});
				  } }
			] : [],
			columns: [
			{% for col in columnsAll %}
				{% if col.name in columns %}
				{
					field: {{ col.name | tojson }},
					title: {{ col.info | tojson }},
					{% if col.name == 'tuuid' or col.name == 'primary_suuid' or col.name == 'mdate' %}
					visible: false,
					{% endif %}
					sortable: true,
					{% if col.name == 'active' and session.role[0] == 1 %}
					editable: {
						type: 'select',
						url:  '/provision/task/active',
						source: [
							{value: 0, text: 'False'},
							{value: 1, text: 'True'},
						]
					},
					{% endif %}
					{% if col.name == 'scope' and session.role[0] == 1 %}
					editable: {
						type: 'select',
						url:  '/provision/task/scope',
						source: [
							{value: 0, text: 'QA'},
							{value: 1, text: 'Production'},
						]
					},
					{% endif %}
				},
				{% endif %}
			{% endfor %}
			]
		});

		$('#deleteButton').click(function ()
		{
			var rowsArr = table.selectedIds('tuuid');

			$.ajax({
				url: "/provision/task/remove",
				type: 'DELETE',
				cache: false,
				data: {'tasks':rowsArr.toString()},
				error: function (request, status, error)
				{
					var jsonValue = jQuery.parseJSON( request.responseText );
					alert(jsonValue.errormsg);
				},
				success: function () {
					table.removeRows('tuuid', rowsArr);
					table.refresh();
					alert("Task(s) removed successfully.");
				}
			});
		});

		$('#addButton').click(function ()
		{
			$.get("/provision/task/new").done(function(data)
			{
				resetModalWindow();
				$('#modalTitle').html('New Provisioning Software Task');
				$('#modalCancelButton').html('Cancel');
				$('#modalBody').html(data);
				$('#modalDialog').addClass("modal-wide");
				$('#modalDialog').modal('show');

				$("#modalDialog").on("hidden.bs.modal", function () {
					table.refresh();
				});
			});
		});
	});

	/* Function used to close Modal window from iframe */
	function closeIFrame()
	{
		$('#modalDialog').modal('hide');
	}

	</script>
{% endblock %}
