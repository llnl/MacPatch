{% extends "base.html" %}

{% block styles %}
	{{ super() }}
	<link href="{{ url_for('static', filename='yarn_components/bootstrap-table/dist/bootstrap-table.css') }}" rel="stylesheet">
{% endblock %}

{% block pageHeader %}
Patch Groups
{% endblock %}

{% block bodyPanel %}
	<div id="toolbar">
		<button id="addButton" type="button" class="btn btn-default" title="New Patch Group"><i class="fa fa-plus"></i></button>
	</div>
	<table id="table" data-toolbar="#toolbar" data-show-export="true" class="table table-bordered table-sm table-striped"></table>
{% endblock %}


{% block javascript %}
	{{ super() }}
	<script src="{{ url_for('static', filename='yarn_components/bootstrap-table/dist/bootstrap-table.min.js') }}"></script>
	<script>
	(function () {
		var currentUser = {{ session.user | tojson }};
		var isAdmin = Number({{ session.role[0] | tojson }}) === 1;

		function canEditMembers(row) { return isAdmin || (row.members || '').split(',').indexOf(currentUser) > -1; }
		function isOwner(row)        { return isAdmin || row.user_id === currentUser; }

		var columns = {{ columns | tojson }}.map(function (c) {
			return { field: c[0], title: c[1], sortable: true, visible: !(c[0] === 'rid' || c[0] === 'id') };
		});
		columns.push({ field: 'members', visible: false });

		var table = MPTable.create('#table', {
			idField: 'id',
			columns: columns,
			data: {{ data | tojson }},
			actions: [
				{ name: 'patches',
				  icon:  function (row) { return canEditMembers(row) ? 'fa-list-ul' : 'fa-search'; },
				  title: function (row) { return canEditMembers(row) ? 'Add/Remove Patches' : 'View Patches'; },
				  onClick: function (row) {
					WizardNavigation.open('/patches/group/edit/' + encodeURIComponent(row.id));
				  } },
				{ name: 'edit', icon: 'fa-pencil', title: 'Edit Patch Group Info',
				  show: function (row) { return canEditMembers(row) && isOwner(row); },
				  onClick: function (row) {
					MPModal.open({ title: 'Edit Patch Group', url: '/patches/patchGroups/edit/' + row.id, height: '200px' });
				  } },
				{ name: 'admins', icon: 'fa-users', title: 'Patch Group Admins',
				  onClick: function (row) {
					MPModal.open({ title: 'Edit Patch Group Admins', url: '/patches/patchGroups/admins/' + row.id,
					               size: 'mid', height: '60vh', footer: false });
				  } },
				{ name: 'remove', icon: 'fa-trash-o', title: 'Remove Patch Group',
				  show: function (row) { return canEditMembers(row) && isOwner(row); },
				  onClick: removeGroup }
			]
		});

		function removeGroup(row) {
			if (!confirm('Are you sure you want to delete this patch group (' + row.name + ') ?')) return;

			MPHttp.postJSON('/patches/patchGroups/delete/' + encodeURIComponent(row.id))
				.then(function (response) {
					if (response.error !== 0) throw new Error('error ' + response.error);
					table.removeRow('id', row.id);
					var label = document.getElementById('labelPatchGroupCount');
					if (label) label.textContent = table.count();
				})
				.catch(function () {
					MPModal.error('Error, Removing Patch Group', 'Delete item error!');
				});
		}

		document.getElementById('addButton').addEventListener('click', function () {
			MPModal.open({ title: 'New Patch Group', url: '/patches/patchGroups/add', height: '200px' });
		});
	}());
	</script>
{% endblock %}
