{% extends "base.html" %}

{% block styles %}
	{{ super() }}
	<link href="{{ url_for('static', filename='yarn_components/bootstrap-table/dist/bootstrap-table.css') }}" rel="stylesheet">
	<link href="{{ url_for('static', filename='css/mp.css') }}" rel="stylesheet">
{%  endblock %}

{% block pageHeader %}

    <span class="d-flex align-items-center justify-content-between">
        <span class="me-3">{{pageTitle}}</span>
            <button type="button" class="btn btn-primary flex-shrink-0" aria-label="About mismatched Apple patches" data-bs-container="body" data-bs-toggle="popover"
                    data-bs-placement="left"
                    data-bs-content="Mismatched apple patches are patches that have been discovered by a scan but don’t have a corresponding patch in the MacPatch Apple patches. Sometimes editing the patch name will resolve the issue.">
              <i class="fa fa-question" aria-hidden="true"></i>
            </button>
    </span>
{%  endblock %}

{% block bodyPanel %}

	<div id="toolbar"></div>
	<table id="table" class="table table-bordered table-sm table-striped"></table>

{% endblock %}


{% block javascript %}
	{{ super() }}

	<script src="{{ url_for('static', filename='yarn_components/bootstrap-table/dist/bootstrap-table.min.js') }}"></script>
	<script src="{{ url_for('static', filename='yarn_components/bootstrap-table/dist/extensions/export/bootstrap-table-export.min.js') }}"></script>
    <script src="{{ url_for('static', filename='yarn_components/tableexport.jquery.plugin/tableExport.min.js') }}"></script>
	<link href="{{ url_for('static', filename='css/mp.css') }}" rel="stylesheet">
	<script>

	$( document ).ready(function()
	{
	    $(function () {
          $('[data-bs-toggle="popover"]').popover()
        })
		MPTable.create('#table', {
			ajax: function loadMyRows(params)
			{
				var _url = "/patches/apple/mismatch/list";
				$.ajax({
					type: 'GET',
					url: _url,
					cache: false,
					dataType: 'json',
					success: function(res)
					{
						params.success({
							me: 'required',
							total: res.total,
							rows: res.data
						});
					}
				});
			},
			toolbar: '#toolbar',
			showExport: true,
			pageSize: 20,
			pageList: [5, 10, 20, 50, 100, 200],
			queryParamsType: "limit",
			sidePagination: "client",
			idField: 'patch',
			sortName: 'count',
			sortOrder: 'desc',
			showRefresh: true,
			exportTypes: ['csv', 'excel', 'json', 'xml', 'txt'],
			columns: {{ columns | tojson }}.map(function (c) {
				return { field: c[0], title: c[1], sortable: true, visible: c[2] !== '0' };
			})
		});

	});

	</script>
{% endblock %}
