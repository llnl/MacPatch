{% extends "base.html" %}

{% block styles %}
	{{ super() }}
	<link href="{{ url_for('static', filename='yarn_components/bootstrap-table/dist/bootstrap-table.css') }}" rel="stylesheet">
{%  endblock %}

{% block pageHeader %}
	Custom Patches
{%  endblock %}

{% block bodyPanel %}
	<div id="custom-patches-table-container">
		<div id="toolbar">
			{% if session.role[0] == 1 %}
			<button id="addButton" type="button" class="btn btn-default" title="Add New Patch"><i class="fa fa-plus"></i></button>
			<button id="dupButton" type="button" class="btn btn-default" title="Duplicate Patch"><i class="fa fa-clone"></i></button>
			<button id="delButton" type="button" class="btn btn-default" title="Delete Patch"><i class="fa fa-trash"></i></button>
			{% endif %}
		</div>
		<table id="table" data-toolbar="#toolbar" class="table table-bordered table-sm table-striped" data-show-export="true"></table>
	</div>
{% endblock %}


{% block javascript %}
	{{ super() }}
	<script src="{{ url_for('static', filename='yarn_components/bootstrap-table/dist/bootstrap-table.min.js') }}"></script>
	<script>
	(function () {
		var isAdmin = Number({{ session.role[0] | tojson }}) === 1;
		var hidden = ['puuid', 'pkg_path', 'pkg_url', 'description'];
		var visibleCols = {{ columns | tojson }};

		var editors = {
			active: { type: 'select', url: '/patches/custom/active',
			          source: [{value: 0, text: 'False'}, {value: 1, text: 'True'}] },
			patch_state: { type: 'select', url: '/patches/custom/state',
			               source: ['Production', 'QA', 'Create', 'Disabled', 'AutoPKG'].map(function (s) { return {value: s, text: s}; }) }
		};

		var allColumns = [{% for col in columnsAll %}{name: {{ col.name | tojson }}, info: {{ col.info | tojson }}}{{ ',' if not loop.last }}{% endfor %}];

		var columns = allColumns
			.filter(function (c) { return visibleCols.indexOf(c.name) > -1; })
			.map(function (c) {
				var col = { field: c.name, title: c.info, sortable: true, visible: hidden.indexOf(c.name) === -1 };
				if (isAdmin && editors[c.name]) col.editable = editors[c.name];
				return col;
			});

		var table = MPTable.create('#table', {
			url: '/patches/custom/list',
			idField: 'puuid',
			showRefresh: true,
			showColumns: false,
			pageList: ['10', '25', '50', '100', 'All'],
			resizable: false,
			checkbox: isAdmin,
			detailFormatter: detailFormatter,
			columns: columns,
			size: 'lg',
			actionsWidth: 70,
			actions: [
				{ name: 'edit',
				  icon:  isAdmin ? 'fa-pencil' : 'fa-search',
				  title: isAdmin ? 'Edit Patch' : 'Patch Data',
				  onClick: function (row, index, e) {
					e.preventDefault();
					WizardNavigation.open('/patches/customPatchWizard/' + encodeURIComponent(row.puuid));
				  } },
				{ name: 'download', icon: 'fa-download', title: 'Download Patch',
				  href: function (row) {
					if (!row.pkg_url) return '';
					return row.pkg_url.includes('WSAccessKey') ? row.pkg_url : '/mp-content' + row.pkg_url;
				  } }
			]
		});

		function detailFormatter(index, row) {
			var description = window.atob(row.description64)
				.replace("Data('", ' ').replace("')", ' ')
				.replace(/\\n/g, ' ').replace(/\\t/g, ' ')
				.replace(/<style([\S\s]*?)>([\S\s]*?)<\/style>/ig, ' ');
			return description.trim() === '' ? '<p>No Description</p>' : description;
		}

		function on(id, fn) { document.getElementById(id)?.addEventListener('click', fn); }

		on('addButton', function () { WizardNavigation.open('/patches/customPatchWizardAdd'); });

		on('delButton', function () {
			if (!confirm('Are you sure you want to remove these patch(es)?')) return;
			var ids = table.selectedIds('puuid');

			MPHttp.delete('/patches/custom/delete', { patches: ids.toString() })
				.then(function () {
					table.removeRows('puuid', ids);
					alert('Patch(es) removed successfully.');
				})
				.catch(function (err) { alert(MPHttp.errorMessage(err)); });
		});

		on('dupButton', function () {
			var ids = table.selectedIds('puuid');
			if (ids.length > 1) {
				alert('Duplicating multiple patches is not permitted. Please select only one patch at a time.');
				return;
			}
			if (!confirm('Are you sure you want to duplicate this patch?')) return;

			MPHttp.post('/patches/custom/duplicate/' + encodeURIComponent(ids[0]))
				.then(function () { table.refresh(); })
				.catch(function (err) { alert(MPHttp.errorMessage(err)); });
		});
	}());

	/* Function used to close Modal window from iframe */
	function closeIFrame() {
		MPModal.close();
	}
	</script>
{% endblock %}
