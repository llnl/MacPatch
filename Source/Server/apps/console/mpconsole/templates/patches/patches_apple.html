{% extends "base.html" %}

{% block styles %}
	{{ super() }}
	<link href="{{ url_for('static', filename='yarn_components/bootstrap-table/dist/bootstrap-table.css') }}" rel="stylesheet">
{%  endblock %}

{% block pageHeader %}
Apple Patches
{%  endblock %}

{% block bodyPanel %}
	<div id="toolbar">
		{% if session.role[0] == 1 %}
		<button id="qaButton" type="button" class="btn btn-default"><i class="fa fa-cog"></i> Create -> QA</button>
		<button id="prodButton" type="button" class="btn btn-default"><i class="fa fa-cog"></i> QA -> Prod</button>
		{% endif %}
	</div>
	<table id="table" data-toolbar="#toolbar" class="table table-bordered table-sm table-striped" data-show-export="true"></table>
{% endblock %}


{% block javascript %}
	{{ super() }}
	<script src="{{ url_for('static', filename='yarn_components/bootstrap-table/dist/bootstrap-table.min.js') }}"></script>
	<script>
	(function () {
		var isAdmin = Number({{ session.role[0] | tojson }}) === 1;
		var hidden = ['rid', 'akey', 'description64', 'description', 'severity_int', 'osver_support'];

		var editors = {
			patch_state: { type: 'select', url: '/patches/apple/state',
			               source: ['Create', 'QA', 'Production', 'Disabled'].map(function (s) { return {value: s, text: s}; }) },
			severity: { type: 'select', url: '/patches/apple/severity',
			            source: ['High', 'Medium', 'Low', 'Critical', 'Unknown'].map(function (s) { return {value: s, text: s}; }) }
		};

		var allColumns = [{% for col in columns %}{name: {{ col.name | tojson }}, info: {{ col.info | tojson }}}{{ ',' if not loop.last }}{% endfor %}];

		var table = MPTable.create('#table', {
			url: '/patches/apple/list',
			idField: 'supatchname',
			showRefresh: true,
			showColumns: false,
			pageList: ['10', '25', '50', '100', 'All'],
			detailView: true,
			detailFormatter: detailFormatter,
			size: 'lg',
			actions: isAdmin ? [
				{ name: 'edit', icon: 'fa-pencil', title: 'Edit',
				  onClick: function (row, index, e) {
					e.preventDefault();
					WizardNavigation.open('/patches/applePatchWizard/' + encodeURIComponent(row.akey));
				  } }
			] : [],
			columns: allColumns.map(function (c) {
				var col = { field: c.name, title: c.info, visible: hidden.indexOf(c.name) === -1, sortable: true };
				if (isAdmin && editors[c.name]) col.editable = editors[c.name];
				return col;
			})
		});

		function detailFormatter(index, row) {
			var description = window.atob(row.description64)
				.replace("Data('", ' ').replace("')", ' ')
				.replace(/\\n/g, ' ').replace(/\\t/g, ' ')
				.replace(/<style([\S\s]*?)>([\S\s]*?)<\/style>/ig, ' ');
			return description.trim() === '' ? '<p>No Description</p>' : description;
		}

		/* Create -> QA and QA -> Production for every Apple patch */
		var pending = false;
		function migratePatches(source, target, url) {
			if (pending || !confirm('Are you sure you want to change all Apple patches in "' + source + '" to "' + target + '"?')) return;
			pending = true;
			var buttons = [document.getElementById('qaButton'), document.getElementById('prodButton')];
			buttons.forEach(function (b) { b.disabled = true; });

			MPBusy.run(MPHttp.getJSON(url), { message: 'Saving...' })
				.then(function (response) {
					if (!Number.isInteger(response.updated) || response.updated < 0) {
						alert('The server did not confirm the patch state change. Refresh the page and try again.');
						return;
					}
					table.refresh();
					alert(response.updated === 0
						? 'No Apple patches are currently in the "' + source + '" state.'
						: 'Moved ' + response.updated + ' Apple patches from ' + source + ' to ' + target + '.');
				})
				.catch(function (err) {
					if (err.status === 401) return;       // the login redirect is already under way
					alert(MPHttp.errorMessage(err) || 'The Apple patch states could not be saved. Please try again.');
				})
				.then(function () {
					pending = false;
					buttons.forEach(function (b) { b.disabled = false; });
				});
		}

		document.getElementById('qaButton')?.addEventListener('click', function () { migratePatches('Create', 'QA', '/patches/apple/bulk/toQA'); });
		document.getElementById('prodButton')?.addEventListener('click', function () { migratePatches('QA', 'Production', '/patches/apple/bulk/toProd'); });
	}());
	</script>
{% endblock %}
