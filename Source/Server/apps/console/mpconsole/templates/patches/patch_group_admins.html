{% block styles %}
<link href="{{ url_for('static', filename='yarn_components/bootstrap-table/dist/bootstrap-table.css') }}" rel="stylesheet">
	<link href="{{ url_for('static', filename='css/mp.css') }}" rel="stylesheet">
	<link href="{{ url_for('static', filename='css/bootstrap4-compat.css') }}" rel="stylesheet">
	<link href="{{ url_for('static', filename='css/console-theme.css') }}" rel="stylesheet">
{% endblock %}

{% block bodyPanel %}

	<div id="patch-group-admins-toolbar">
		<button id="addPatchGroupAdminButton" type="button" class="btn btn-default" title="Add Patch Group Admin"><i class="glyphicon glyphicon-plus" aria-hidden="true"></i></button>
		<button id="deletePatchGroupAdminButton" type="button" class="btn btn-default" title="Remove Selected Admins"><i class="glyphicon glyphicon-trash" aria-hidden="true"></i></button>
	</div>
	<table id="table_admins" class="table table-bordered table-sm table-striped"></table>

{% endblock %}

{% block javascript %}
	<script src="{{ url_for('static', filename='yarn_components/bootstrap-table/dist/bootstrap-table.min.js') }}"></script>
	<script>
	(function ($) {
		'use strict';

	var groupId = {{ group_id | tojson }};
	var isAdmin = Number({{ session.role[0] | tojson }}) === 1;
	var $table, table;

	$( document ).ready(function()
	{
		var columns = {{ columns | tojson }}.filter(function (c) {
			return c[0] !== 'rid';      // the checkbox column replaces it
		}).map(function (c) {
			var col = { field: c[0], title: c[1], sortable: true };
			if (c[0] === 'user_id' && isAdmin) {
				col.editable = {
					title: 'Edit User ID',
					type: 'text',
					emptytext: 'Click to enter user ID',
					validate: function (value) {
						if (!value.trim()) return 'A user ID is required.';
					},
					pk: 1,
					url: '/patches/patchGroup/member/add/' + encodeURIComponent(groupId)
				};
			}
			return col;
		});

		table = MPTable.create('#table_admins', {
			url: '/patches/patchGroup/members/' + encodeURIComponent(groupId),
			toolbar: '#patch-group-admins-toolbar',
			checkbox: true,
			pageSize: 10,
			pageList: [5, 10, 20, 50],
			pagination: false,
			showRefresh: true,
			showColumns: false,
			persistColumns: false,
			idField: 'user_id',
			columns: columns
		});
		$table = table.$el;

		$table.on('editable-save.bs.table', function () {
			// Let the editor finish saving before replacing its row.
			setTimeout(function () { table.refresh(); }, 0);
		});

		$('#addPatchGroupAdminButton').click(function (event)
		{
			event.stopPropagation();
			var randomId = 100 + ~~(Math.random() * 100);
			$table.bootstrapTable('insertRow', {
				index: 0,
				row: {
					rid: randomId,
					user_id: '',
					is_owner: 0
				}
			});
			$table.find('tbody tr').first().find('a.mp-editable[data-mp-edit="user_id"]').click();
		});

		$('#deletePatchGroupAdminButton').click(function ()
		{
			var ids = table.selectedIds('user_id');
			table.removeRows('user_id', ids);

			// Create form object of the id(s) to remove
			var formData = new FormData();
			formData.append('ids', ids);

			$.ajax({
				type:'POST',
				url: '/patches/patchGroup/member/delete/' + encodeURIComponent(groupId),
				data: formData,
				cache: false,
				processData: false,
				contentType: false,
				success: function() {
					table.refresh();
					alert("Admin Deleted Successfully");
				},
				error: function(jqXHR, textStatus, errorThrown) {
					table.refresh();
					alert("Admin Failed to Delete");
				}
			});
		});
	});

	}(jQuery));
	</script>
{% endblock %}
