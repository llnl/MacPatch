{% extends "base.html" %}

{% block styles %}
	{{ super() }}
	<link href="{{ url_for('static', filename='yarn_components/bootstrap-table/dist/bootstrap-table.css') }}" rel="stylesheet">
{%  endblock %}

{% block pageHeader %}
	Software Tasks
{%  endblock %}

{% block bodyPanel %}
	<div id="toolbar">
		{% if session.role[0] == 1 %}
		<button id="addButton" type="button" class="btn btn-default" title="New Software Task"><i class="fa fa-plus"></i></button>
		<button id="deleteButton" type="button" class="btn btn-default" title="Delete Software Task"><i class="fa fa-trash"></i></button>
		{% endif %}
	</div>
	<table id="table" class="table table-bordered table-sm table-striped" data-toolbar="#toolbar"></table>
{% endblock %}


{% block javascript %}
	{{ super() }}
	<script src="{{ url_for('static', filename='yarn_components/bootstrap-table/dist/bootstrap-table.min.js') }}"></script>
	<script>
	(function () {
		var isAdmin = Number({{ session.role[0] | tojson }}) === 1;

		var table = MPTable.create('#table', {
			idField: 'tuuid',
			showColumns: false,
			checkbox: isAdmin,
			columns: {{ data["columns"] | tojson }},
			data: {{ data["rows"] | tojson }},
			size: 'lg',
			actionsWidth: 60,
			actions: isAdmin ? [
				{ name: 'edit', icon: 'fa-pencil', title: 'Edit',
				  onClick: function (row) {
					MPModal.open({ title: 'Edit Software Task', url: '/software/task/edit/' + encodeURIComponent(row.tuuid), size: 'wide' });
				  } }
			] : []
		});

		document.getElementById('addButton')?.addEventListener('click', function () {
			MPModal.open({ title: 'New Software Task', url: '/software/task/new', size: 'wide',
			               onHidden: function () { table.refresh(); } });
		});

		document.getElementById('deleteButton')?.addEventListener('click', function () {
			var ids = table.selectedIds('tuuid');
			MPHttp.delete('/software/task/remove', { tasks: ids.toString() })
				.then(function () {
					table.removeRows('tuuid', ids);
					alert('Task(s) removed successfully.');
				})
				.catch(function (err) { alert(MPHttp.errorMessage(err)); });
		});
	}());
	</script>
{% endblock %}
