{% extends "base.html" %}

{% block styles %}
	{{ super() }}
	<link href="{{ url_for('static', filename='yarn_components/bootstrap-table/dist/bootstrap-table.css') }}" rel="stylesheet">
{%  endblock %}

{% block pageHeader %}
	{{title}}
{%  endblock %}

{% block bodyPanel %}
	<div id="toolbar">
		{% if session.role[0] == 1 %}
		<button id="addButton" type="button" class="btn btn-default" title="Add Software Group"><i class="fa fa-plus"></i></button>
		{% endif %}
	</div>
	<table id="table" class="table table-bordered table-sm table-striped" data-toolbar="#toolbar"></table>
{% endblock %}


{% block javascript %}
	{{ super() }}
	<script src="{{ url_for('static', filename='static_components/macpatch/mp.js') }}"></script>
	<script src="{{ url_for('static', filename='yarn_components/bootstrap-table/dist/bootstrap-table.min.js') }}"></script>
	<script>
	(function () {
		var isAdmin = Number({{ session.role[0] | tojson }}) === 1;

		var table = MPTable.create('#table', {
			idField: 'gid',
			pageSize: 20,
			showColumns: false,
			columns: {{ data["columns"] | tojson }},
			data: {{ data["rows"] | tojson }},
			actionsWidth: 100,
			actions: [
				{ name: 'tasks',
				  icon:  isAdmin ? 'fa-th-list' : 'fa-search',
				  title: isAdmin ? 'Add/Remove Software Tasks' : 'View Software Tasks',
				  onClick: function (row) {
					WizardNavigation.open('/software/group/' + encodeURIComponent(row.gid) + '/tasks');
				  } },
				{ name: 'edit', icon: 'fa-pencil', title: 'Edit Software Group Info',
				  show: function () { return isAdmin; },
				  onClick: function (row) {
					MPModal.open({ title: 'Edit Software Group Info', url: '/software/group/edit/' + encodeURIComponent(row.gid), height: '200px' });
				  } },
				{ name: 'remove', icon: 'fa-trash-o', title: 'Remove Software Group',
				  show: function () { return isAdmin; },
				  onClick: function (row) {
					if (!confirm('Are you sure to delete this software group (' + row.gName + ') ?')) return;
					MPHttp.delete('/software/group/delete/' + encodeURIComponent(row.gid))
						.then(function () {
							table.removeRow('gid', row.gid);
							alert('Group removed successfully.');
						})
						.catch(function (err) { alert(MPHttp.errorMessage(err)); });
				  } }
			],
			leadColumns: [
				{ field: 'filter', title: 'Filter', align: 'center', width: 80,
				  formatter: function () {
					return '<a class="swfilter" href="javascript:void(0)" title="Software Group Filter">' +
					       '<i class="fa fa-filter fa-lg" aria-hidden="true"></i></a>';
				  },
				  events: { 'click .swfilter': function (e, value, row) {
					MPModal.open({ title: 'Software Group Filters - ' + row.gName,
					               iframe: '/software/group/filters/' + encodeURIComponent(row.gid),
					               size: 'wide', height: '76vh' });
					document.getElementById('modalSaveButton').style.display = 'none';
				  } } }
			]
		});

		document.getElementById('addButton')?.addEventListener('click', function () {
			MPModal.open({ title: 'Add Software Group', url: '/software/group/add/' + guid(), height: '200px' });
		});
	}());
	</script>
{% endblock %}
