{% extends "base.html" %}

{% block styles %}
	{{ super() }}
	<link href="{{ url_for('static', filename='yarn_components/bootstrap-table/dist/bootstrap-table.css') }}" rel="stylesheet">
	<style>
		.software-package-modal .modal-title { font-size: 18px; line-height: 24px; font-weight: 600; }
	</style>
{%  endblock %}

{% block pageHeader %}
	Software Packages
{%  endblock %}

{% block bodyPanel %}
	<div id="toolbar">
		{% if session.role[0] == 1 %}
		<button id="delButton" type="button" class="btn btn-default" title="Delete Package"><i class="fa fa-trash"></i></button>
		<button id="addButton" type="button" class="btn btn-default" title="New Package"><i class="fa fa-plus"></i></button>
		<button id="dupButton" type="button" class="btn btn-default" title="Duplicate Package"><i class="fa fa-clone"></i></button>
		<button id="taskButton" type="button" class="btn btn-default" title="Generate Task from Package"><i class="fa fa-share-square-o"></i></button>
		{% endif %}
	</div>
	<table id="table" class="table table-bordered table-sm table-striped" data-toolbar="#toolbar"></table>
{% endblock %}


{% block javascript %}
	{{ super() }}
	<script src="{{ url_for('static', filename='yarn_components/bootstrap-table/dist/bootstrap-table.min.js') }}"></script>
	<script>
	(function () {
		var isAdmin = Number({{ session.role[0] | tojson }}) === 1;

		$('#modalDialog').on('hidden.bs.modal.softwarePackage', function () {
			this.classList.remove('software-package-modal');
		});

		var table = MPTable.create('#table', {
			idField: 'suuid',
			showColumns: false,
			pageSize: 10,
			checkbox: isAdmin,
			columns: {{ data["columns"] | tojson }},
			data: {{ data["rows"] | tojson }},
			size: 'lg',
			actionsWidth: 100,
			actions: [
				{ name: 'edit',
				  icon:  isAdmin ? 'fa-pencil' : 'fa-search',
				  title: isAdmin ? 'Edit Package' : 'Package Data',
				  onClick: function (row, index, e) {
					e.preventDefault();
					WizardNavigation.open('/software/package/edit/' + encodeURIComponent(row.suuid));
				  } },
				{ name: 'download', icon: 'fa-download', title: 'Download Package',
				  href: function (row) { return '/mp-content' + row.sw_url; } }
			]
		});

		function selected() {
			var rows = table.selections();
			return { ids: rows.map(function (r) { return r.suuid; }), names: rows.map(function (r) { return r.sName; }) };
		}

		/* Requires exactly one selected package */
		function single(what) {
			var s = selected();
			if (s.ids.length === 0) { alert('Please choose a package to ' + what + '.'); return null; }
			if (s.ids.length > 1)   { alert('Please choose only 1 package.'); return null; }
			return s;
		}

		function on(id, fn) { document.getElementById(id)?.addEventListener('click', fn); }

		on('addButton', function () { WizardNavigation.open('/software/package/add'); });

		on('delButton', function () {
			var s = selected();
			if (!confirm('Are you sure to delete (' + s.names + ') ?')) return;

			MPHttp.getJSON('/software/package/delete/' + s.ids)
				.then(function (result) {
					if (result.error !== 0) throw new Error('error ' + result.error);
					table.removeRows('suuid', s.ids);
				})
				.catch(function () { MPModal.error('Error, Removing Software Package', 'Delete item error!'); });
		});

		on('dupButton', function () {
			var s = single('duplicate');
			if (!s || !confirm('Are you sure to duplicate (' + s.names + ') ?')) return;

			MPHttp.getJSON('/software/package/duplicate/' + s.ids)
				.then(function (result) {
					alert(result.error === 0 ? 'Software package was duplicated successfully.'
					                         : 'Error, software package was not duplicated.');
				})
				.catch(function () { alert('Error, software package was not duplicated.'); });
		});

		on('taskButton', function () {
			var s = single('generate a task for');
			if (!s || !confirm('Are you sure to generate a task for (' + s.names + ') ?')) return;

			MPHttp.postJSON('/software/task/generate/' + s.ids)
				.then(function (result) {
					alert(result.error === 0 ? 'Software task was generated successfully.'
					                         : 'Error, software task was not generated.');
				})
				.catch(function () { alert('Error, software task was not generated.'); });
		});
	}());

	function closeModal() {
		MPModal.close();
	}
	</script>
{% endblock %}
