{% extends "base.html" %}

{% block styles %}
	{{ super() }}
	<link href="{{ url_for('static', filename='yarn_components/bootstrap-table/dist/bootstrap-table.css') }}" rel="stylesheet">
	<link href="{{ url_for('static', filename='css/mp.css') }}" rel="stylesheet">
{%  endblock %}

{% block pageHeader %}
	Agent Configurations
{%  endblock %}

{% block bodyPanel %}
	<div id="toolbar">
		<button id="addButton" type="button" class="btn btn-default" title="New Agent Config"><i class="fa fa-plus"></i></button>
		<button id="deleteButton" type="button" class="btn btn-default" title="Delete Agent Config"><i class="fa fa-trash"></i></button>
	</div>
	<table id="table" class="table table-bordered table-sm table-striped"></table>
{% endblock %}


{% block javascript %}
	{{ super() }}
	<script src="{{ url_for('static', filename='yarn_components/bootstrap-table/dist/bootstrap-table.min.js') }}"></script>
	<script>
	(function () {
		function openModal(url, title) {
			$.get(url).done(function (data) {
				resetModalWindow();
				$('#modalTitle').html(title);
				$('#modalBody').html(data);
				$('#modalDialog').addClass("modal-wide");
				$('#modalDialog').modal('show');

				$("#modalDialog").on("hidden.bs.modal", function () {
					table.refresh();
				});
			});
		}

		var table = MPTable.create('#table', {
			striped: true,
			url: '/console/agent/config/list',
			dataField: 'data',
			ajaxOptions: { cache: false },
			pagination: false,
			showToggle: false,
			showRefresh: true,
			clickToSelect: true,
			toolbar: '#toolbar',
			checkbox: true,
			stateField: 'rowState',
			size: 'lg',
			actions: [
				{ name: 'edit', icon: 'fa-pencil', title: 'Edit',
				  onClick: function (row) { openModal('/console/agent/config/edit/' + row.aid, 'Edit Agent Configuration'); } }
			],
			columns: {{ columns | tojson }}.map(function (c) {
				return { field: c[0], title: c[1], sortable: true };
			})
		});

		$('#addButton').on('click', function () { openModal('/console/agent/config/add', 'New Agent Configuration'); });

		$('#deleteButton').on('click', function () {
			var selections = table.selections();
			if (selections.length == 0) {
				alert("Please select at least one configuration to delete.");
				return;
			}

			var hasDefault = selections.some(function (r) { return r.isDefault == 1; });
			if (hasDefault) {
				alert("Cannot delete the default configuration. Please set another configuration as default first.");
				return;
			}

			if (!confirm("Are you sure you want to delete the selected configuration(s)?")) {
				return;
			}

			$.ajax({
				url: '/console/agent/config/remove',
				type: 'DELETE',
				data: {'aids': table.selectedIds('aid').join(",")},
				success: function () { table.refresh(); },
				error: function (e) { alert("Error deleting configuration: " + e.responseText); }
			});
		});
	}());
	</script>
{% endblock %}
