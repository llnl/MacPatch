{% extends "base.html" %}

{% block styles %}
	{{ super() }}
	<link href="{{ url_for('static', filename='yarn_components/bootstrap-table/dist/bootstrap-table.css') }}" rel="stylesheet">
	<link href="{{ url_for('static', filename='css/mp.css') }}" rel="stylesheet">

{%  endblock %}

{% block pageHeader %}
	Agent Plugins
{%  endblock %}

{% block bodyPanel %}

	<div id="toolbar">
		<button id="addButton" type="button" class="btn btn-default"><i class="glyphicon glyphicon-plus"></i></button>
		<button id="delButton" type="button" class="btn btn-default"><i class="glyphicon glyphicon-trash"></i></button>
	</div>
	<table id="table" class="table table-bordered table-sm table-striped" data-show-export="true"></table>

{% endblock %}


{% block javascript %}
	{{ super() }}
	<script src="{{ url_for('static', filename='yarn_components/bootstrap-table/dist/bootstrap-table.min.js') }}"></script>
	<script>
	(function () {
		function openModal(url, title) {
			$.get(url).done(function (data) {
				$('#modalTitle').html(title);
				$('#modalBody').html(data);
				$('#modalDialog').addClass("modal-mid");
				$('#modalBody').css({'height': '360px'});
				$('#modalDialog').modal('show');

				$("#modalDialog").on("hidden.bs.modal", function () {
					table.refresh();
				});
			});
		}

		var table = MPTable.create('#table', {
			url: '/console/agent/plugins/list',
			dataField: 'data',
			ajaxOptions: { cache: false },
			pageSize: 20,
			pageList: [5, 10, 20, 50, 100, 200],
			showRefresh: true,
			toolbar: '#toolbar',
			checkbox: true,
			stateField: 'rowState',
			size: 'lg',
			actions: [
				{ name: 'edit', icon: 'fa-pencil', title: 'Edit',
				  onClick: function (row) { openModal('/console/agent/plugins/' + row.rid, 'Edit Agent Plugin'); } }
			],
			columns: {{ columns | tojson }}.map(function (c) {
				return { field: c[0], title: c[1], sortable: true, visible: c[2] !== '0' };
			})
		});

		$('#delButton').click(function () {
			var rowsArr = table.selectedIds('rid');

			if (confirm("Are you sure you want to remove these agent plugins?") == true) {
				$.ajax({
					url: "/console/agent/plugins",
					type: 'DELETE',
					cache: false,
					data: {'rid': rowsArr.toString()},
					error: function (request) {
						alert(jQuery.parseJSON(request.responseText).errormsg);
					},
					success: function () {
						alert("Plugin(s) removed successfully.");
						table.refresh();
					}
				});
			}
		});

		$('#addButton').click(function () { openModal('/console/agent/plugins/0', 'Add Agent Plugin'); });
	}());
	</script>
{% endblock %}
