{% extends "base.html" %}

{% block styles %}
	{{ super() }}
	<link href="{{ url_for('static', filename='yarn_components/bootstrap-table/dist/bootstrap-table.css') }}" rel="stylesheet">
{%  endblock %}

{% block pageHeader %}
MacPatch Servers
{%  endblock %}

{% block bodyPanel %}
	<div id="toolbar">
		<button id="addButton" type="button" class="btn btn-default"><i class="glyphicon glyphicon-plus"></i></button>
		<button id="delButton" type="button" class="btn btn-default"><i class="glyphicon glyphicon-trash"></i></button>
	</div>
	<table id="table" class="table table-bordered table-sm table-striped" data-show-export="true"></table>
{% endblock %}


{% block javascript %}
	{{ super() }}
	<script src="{{ url_for('static', filename='yarn_components/bootstrap-table/dist/bootstrap-table.min.js') }}"></script>
	<script>
	var table;

	function openModal(title, html, o) {
		resetModalWindow();
		$('#modalTitle').text(title);
		$('#modalBody').html(html).css({'height': o.height});
		$('#modalDialog').addClass(o.cls);
		if (o.noFooter) $('#modalFooter').hide();
		$('#modalDialog').modal('show');
		$('#modalSaveButton').toggle(!o.noFooter);
	}

	$( document ).ready(function()
	{
		table = MPTable.create('#table', {
			url: '/console/servers/mp/list',
			dataField: 'data',
			search: false,
			pageSize: 20,
			pageList: [5, 10, 20, 50, 100, 200],
			showRefresh: true,
			size: 'lg',
			actionsWidth: 260,
			checkbox: true,
			stateField: 'rowState',
			idField: 'rid',
			actions: [
				{ name: 'edit', icon: 'fa-pencil', title: 'Edit',
				  onClick: function (row) {
					$.get("/console/servers/mp/" + row['rid']).done(function (data) {
						openModal('Edit MacPatch Server', data, {height: '440px', cls: 'modal-mid'});
						$("#modalDialog").one("hidden.bs.modal", function () { table.refresh(); });
					});
				  } },
				{ name: 'dbConf', icon: 'fa-database', title: 'Database Config',
				  onClick: function (row) {
					$.get("/console/servers/db/" + row['rid']).done(function (data) {
						openModal('MacPatch Server DB Config - ' + row['server'], data, {height: '440px', cls: 'modal-mid', noFooter: true});
					});
				  } },
				{ name: 'logA', icon: 'fa-file-text-o', title: 'API Log', label: 'API', className: 'server-log-action',
				  onClick: function (row) {
					$.get("/console/server/log/" + row['rid'] + "/mpwsapi").done(function (data) {
						openModal(row['server'] + ' - API Log', data, {height: '90vh', cls: 'modal-wide', noFooter: true});
					});
				  } },
				{ name: 'logC', icon: 'fa-file-text-o', title: 'Console Log', label: 'Console', className: 'server-log-action',
				  onClick: function (row) {
					$.get("/console/server/log/" + row['rid'] + "/mpconsole").done(function (data) {
						openModal(row['server'] + ' - Console Log', data, {height: '90vh', cls: 'modal-wide', noFooter: true});
					});
				  } }
			],
			columns: {{ columns | tojson }}.map(function (c) {
				return { field: c[0], title: c[1], sortable: true, visible: c[2] !== '0' };
			})
		});
	});

	var $_delPluginButton = $('#delButton'), $_addPluginButton = $('#addButton');
	$(function () {
		$_delPluginButton.click(function ()
		{
			var rowsArr = table.selectedIds('rid');

			if (confirm("Are you sure you want to remove these servers?") == true)
			{
				var _url = "/console/servers/mp/update";
				$.ajax({
					url: _url,
					type: 'DELETE',
					cache: false,
					data: {'rid':rowsArr.toString()},
					error: function (request, status, error)
					{
						jsonValue = jQuery.parseJSON( request.responseText );
						alert(jsonValue.errormsg);
					},
					success: function () {
						alert("Server(s) removed successfully.");
						table.refresh();
					}
				});
			}
		});

		$_addPluginButton.click(function ()
		{
			$.get( "/console/servers/mp/0").done(function(data)
			{
			    resetModalWindow();
				$('#modalTitle').html('Add MacPatch Server');
				$('#modalBody').html(data);
				$('#modalDialog').addClass("modal-mid");
				$('#modalBody').css({'height':'420px'});
				$('#modalDialog').modal('show');

				$("#modalDialog").on("hidden.bs.modal", function () {
					table.refresh();
				});
			});
		});
	});
	</script>
{% endblock %}
