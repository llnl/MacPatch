{% extends "base.html" %}

{% block styles %}
	{{ super() }}
	<link href="{{ url_for('static', filename='yarn_components/bootstrap-table/dist/bootstrap-table.css') }}" rel="stylesheet">
	<link href="{{ url_for('static', filename='css/mp.css') }}" rel="stylesheet">

{%  endblock %}

{% block pageHeader %}
	Accounts
{%  endblock %}

{% block bodyPanel %}

	<div id="toolbar">
		{% if session.role[0] == 1 %}
		<button id="addButton" type="button" class="btn btn-default"><i class="fa fa-plus"></i></button>
		<button id="delButton" type="button" class="btn btn-default"><i class="fa fa-trash"></i></button>
		{% endif %}
	</div>
	<table id="table" class="table table-bordered table-sm table-striped" data-show-export="true"></table>

{% endblock %}


{% block javascript %}
	{{ super() }}
	<script src="{{ url_for('static', filename='yarn_components/bootstrap-table/dist/bootstrap-table.min.js') }}"></script>
	<script>
	(function () {
		{% set rows = [] %}
		{% for d in data %}
			{% set row = {} %}
			{% for col in columns %}
				{% if col[0] == 'user_type' %}
					{% set _ = row.update({col[0]: 'LDAP' if d[col[0]] == 2 else ('Console' if d[col[0]] == 0 else 'Standard')}) %}
				{% elif col[0] == 'enabled' %}
					{% set _ = row.update({col[0]: 'Yes' if d[col[0]] == 1 else 'No'}) %}
				{% else %}
					{% set _ = row.update({col[0]: d[col[0]] | string}) %}
				{% endif %}
			{% endfor %}
			{% set _ = rows.append(row) %}
		{% endfor %}

		function openModal(url, title) {
			resetModalWindow();
			$.get(url).done(function (data) {
				$('#modalTitle').html(title);
				$('#modalBody').html(data);
				$('#modalDialog').addClass("modal-mid");
				$('#modalBody').css({'height': '600px'});
				$('#modalDialog').modal('show');
			});
		}

		var table = MPTable.create('#table', {
			idField: 'user_id',
			pageList: ['10', '25', '50', '100', 'All'],
			showColumns: false,
			toolbar: '#toolbar',
			checkbox: true,
			size: 'lg',
			actions: [
				{ name: 'edit', icon: 'fa-pencil', title: 'Edit',
				  onClick: function (row) { openModal('/console/account/' + row.user_id, 'Edit Account'); } }
			],
			columns: {{ columns | tojson }}.map(function (c) {
				return { field: c[0], title: c[1], sortable: true, visible: c[0] !== 'profileID' };
			}),
			data: {{ rows | tojson }}
		});

		$('#delButton').click(function () {
			var ids = table.selectedIds('user_id');

			if (ids.length > 1) {
				alert("Please choose only one account to delete at a time.");
				return true;
			}
			if (confirm("Are you sure you want to remove this account(s)?") == true) {
				$.ajax({
					type: 'DELETE',
					url: '/console/account/' + ids,
					cache: false,
					processData: false,
					contentType: false,
					success: function () {
						alert("Account Deleted Successfully");
					},
					error: function () {
						alert("Account Failed to Delete");
					}
				});
			}

			table.removeRows('user_id', ids);
		});

		$('#addButton').click(function () { openModal('/console/account/add', 'Add Account'); });
	}());
	</script>
{% endblock %}
