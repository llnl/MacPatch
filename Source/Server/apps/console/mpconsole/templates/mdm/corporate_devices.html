{% extends "base.html" %}

{% block styles %}
	{{ super() }}
	<link href="{{ url_for('static', filename='yarn_components/bootstrap-table/dist/bootstrap-table.css') }}" rel="stylesheet">
{% endblock %}

{% block pageHeader %}
MDM - Corporate Devices
{% endblock %}

{% block bodyPanel %}
	<div id="toolbar">
		{% if session.role[0] == 1 %}
		<button id="queryButton" type="button" class="btn btn-default" title="Search InTune For A Device"><i class="fa fa-search"></i></button>
		<button id="addButton" type="button" class="btn btn-default" title="Add New Corporate Device"><i class="fa fa-plus"></i></button>
		<button id="syncButton" type="button" class="btn btn-default" title="Sync Content from InTune"><i class="fa fa-cloud-download"></i></button>
		{% endif %}
		&nbsp;<span id="lastSync">Last Sync: {{ lastSync }}</span>
	</div>
	<table id="table" data-toolbar="#toolbar" data-show-export="true" class="table table-bordered table-sm table-striped"></table>
{% endblock %}


{% block javascript %}
	{{ super() }}
	<script src="{{ url_for('static', filename='yarn_components/bootstrap-table/dist/bootstrap-table.min.js') }}"></script>
	<script>
	(function () {
		MPTable.create('#table', {
			url: '/mdm/corporateDevices/list',
			idField: 'rid',
			showRefresh: true,
			columns: {{ columns | tojson }}.map(function (c) {
				return { field: c.column, title: c.displayName, visible: c.visible !== 0, sortable: true };
			})
		});

		function openFrame(title, url, height) {
			MPModal.open({ title: title, iframe: url, size: 'mid', height: height });
			document.getElementById('modalSaveButton').style.display = 'none';
			document.getElementById('modalCancelButton').style.display = 'none';
		}

		function on(id, fn) { document.getElementById(id)?.addEventListener('click', fn); }

		on('addButton',   function () { openFrame('New Corporate Device', '/mdm/corporateDevice/add', '40vh'); });
		on('queryButton', function () { openFrame('Live Corporate Device Search', '/mdm/corporateDevice/live/query', '60vh'); });

		on('syncButton', function () {
			var label = document.getElementById('lastSync');
			label.innerHTML = '<i class="fa fa-gear fa-spin"></i> Getting Data';

			MPHttp.getJSON('/mdm/runSync/corporateDevices')
				.then(function (obj) { label.textContent = 'Last Sync: ' + obj.lastSync; })
				.catch(function () { label.textContent = 'Error getting sync data.'; });
		});
	}());
	</script>
{% endblock %}
