{% extends "base.html" %}

{% block styles %}
	{{ super() }}
	<link href="{{ url_for('static', filename='yarn_components/bootstrap-table/dist/bootstrap-table.css') }}" rel="stylesheet">
{% endblock %}

{% block pageHeader %}
MDM - InTune Groups
{% endblock %}

{% block bodyPanel %}
	<div id="toolbar">
		{% if session.role[0] == 1 %}
		<button id="addButton" type="button" class="btn btn-default" title="Add MDM Group"><i class="fa fa-plus"></i></button>
		{% endif %}
	</div>
	<table id="table" data-toolbar="#toolbar" data-show-export="true" class="table table-bordered table-sm table-striped"></table>
{% endblock %}


{% block javascript %}
	{{ super() }}
	<script src="{{ url_for('static', filename='yarn_components/bootstrap-table/dist/bootstrap-table.min.js') }}"></script>
	<script>
	(function () {
		MPTable.create('#table', {
			url: '/mdm/groups/list',
			idField: 'id',
			showRefresh: true,
			size: 'lg',
			actionsWidth: 60,
			actions: [
				{ name: 'edit', icon: 'fa-pencil', title: 'Group Members',
				  onClick: function (row) { window.location.assign('/mdm/groups/members/' + encodeURIComponent(row.id)); } }
			],
			columns: {{ columns | tojson }}.map(function (c) {
				return { field: c.column, title: c.displayName, visible: c.visible !== 0, sortable: true };
			})
		});

		document.getElementById('addButton')?.addEventListener('click', function () {
			MPModal.open({ title: 'New MDM Group', iframe: '/mdm/groups/add', size: 'mid', height: '40vh' });
			document.getElementById('modalSaveButton').style.display = 'none';
			document.getElementById('modalCancelButton').style.display = 'none';
		});
	}());
	</script>
{% endblock %}
