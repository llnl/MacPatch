<!DOCTYPE html>
<meta name="csrf-token" content="{{ csrf_token() }}">
	<script>window.MP_PREFS = {{ user_prefs | default({}) | tojson }};</script>
{% block styles %}
	<link href="{{ url_for('static', filename='css/sb-admin-2-bs5.min.css') }}" rel="stylesheet">
	<link href="{{ url_for('static', filename='css/bootstrap4-compat.css') }}" rel="stylesheet">
	<link href="{{ url_for('static', filename='css/console-theme.css') }}" rel="stylesheet">
	<link href="{{ url_for('static', filename='yarn_components/@fortawesome/fontawesome-free/css/all.min.css') }}" rel="stylesheet" type="text/css">
	<link href="{{ url_for('static', filename='yarn_components/@fortawesome/fontawesome-free/css/v4-shims.min.css') }}" rel="stylesheet" type="text/css">

	<link href="{{ url_for('static', filename='yarn_components/bootstrap-table/dist/bootstrap-table.css') }}" rel="stylesheet">
	<link href="{{ url_for('static', filename='css/mp.css') }}" rel="stylesheet">
	<link href="{{ url_for('static', filename='css/console-theme.css') }}" rel="stylesheet">
{%  endblock %}

{% block body %}
	<div>
		<div id="chartDataToolbar"></div>
		<table id="chartDataTable" data-show-export="true" class="table table-bordered table-sm table-striped"></table>
	</div>
	<div id="overlay">
		<img id="overlayImg" src="{{ url_for('static', filename='img/36.png')}}" style="display:block;margin:auto;padding-top:10%;" />
		<h1 style="text-align: center; color: white; ">Saving...</h1>
	</div>
{% endblock %}


{% block javascript %}
	<!-- jQuery -->
	<script src="{{ url_for('static', filename='yarn_components/jquery/dist/jquery.min.js') }}"></script>
	<script src="{{ url_for('static', filename='static_components/macpatch/session-navigation.js') }}"></script>
	<script src="{{ url_for('static', filename='static_components/bootstrap5/bootstrap.bundle.min.js') }}"></script>

	<script src="{{ url_for('static', filename='yarn_components/bootstrap-table/dist/bootstrap-table.min.js') }}"></script>
    <script src="{{ url_for('static', filename='yarn_components/bootstrap-table/dist/extensions/export/bootstrap-table-export.min.js') }}"></script>
	<script src="{{ url_for('static', filename='yarn_components/tableexport.jquery.plugin/tableExport.min.js') }}"></script>
	<script src="{{ url_for('static', filename='static_components/macpatch/mp-http.js') }}"></script>
	<script src="{{ url_for('static', filename='static_components/macpatch/mp-table.js') }}"></script>

	<script>
	$( document ).ready(function()
	{
		MPTable.create('#chartDataTable',
		{
			toolbar: '#chartDataToolbar',
			columnsKey: 'dashboard-chart-data',
			striped: true,
			url: "/dashboard/data/{{chart}}/{{value}}",
			search: true,
			pageSize: 20,
			pageList: [5, 10, 20, 50, 100, 200],
			pagination: true,
			sidePagination: "client",
			showRefresh: true,
			idField: 'cuuid',
            showColumns: true,
            exportTypes: ['json', 'xml', 'csv', 'txt'],
            exportDataType: "all",
			columns: [
				{% for col in columns %}
				{
					field: {{ col['name'] | tojson }},
					title: {{ col['label'] | tojson }},
					sortable: true
				},
				{% endfor %}
			]
		});
	});

	</script>
{% endblock %}
