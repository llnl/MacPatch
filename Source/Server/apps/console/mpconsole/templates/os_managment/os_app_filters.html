{% extends "base.html" %}

{% block styles %}
	{{ super() }}
	<link href="{{ url_for('static', filename='yarn_components/bootstrap-table/dist/bootstrap-table.css') }}" rel="stylesheet">
	<link href="{{ url_for('static', filename='css/mp.css') }}" rel="stylesheet">

{%  endblock %}

{% block pageHeader %}
	Software Restrictions
{%  endblock %}

{% block bodyPanel %}

	<div id="toolbar">
		<button id="addButton" type="button" class="btn btn-default"><i class="fa fa-plus"></i></button>
		<button id="delButton" type="button" class="btn btn-default"><i class="fa fa-trash"></i></button>
	</div>
	<table id="table" class="table table-bordered table-sm table-striped" data-show-export="true"></table>

{% endblock %}


{% block javascript %}
	{{ super() }}
	<script src="{{ url_for('static', filename='yarn_components/bootstrap-table/dist/bootstrap-table.min.js') }}"></script>
	<script>
	function formatYesNo(value, row, index)
	{
		if (Number.isInteger(value))
		{
			return value==0 ? 'No' : 'Yes';
		}
		return value;
	}

	$( document ).ready(function()
	{
		var table = MPTable.create('#table', {
			url: "/osmanage/app_filter/list",
			toolbar: '#toolbar',
			showRefresh: true,
			pageList: ['10', '25', '50', '100', 'All'],
			idField: 'appID',
			checkbox: true,
			size: 'lg',
			actionsWidth: 30,
			actions: [
				{ name: 'edit', icon: 'fa-pencil', title: 'Edit',
				  onClick: function (row) {
					$.get("/osmanage/app_filter/edit/" + encodeURIComponent(row['appID'])).done(function(data)
					{
						$('#modalTitle').html('Edit Software Restriction');
						$('#modalCancelButton').html('Cancel');
						$('#modalBody').html(data);
						$('#modalDialog').addClass("modal-wide");
						$('#modalDialog').modal('show');

						$("#modalDialog").on("hidden.bs.modal", function () {
							table.refresh();
							$(".mySWResForm").html("");
						});
					});
				  } }
			],
			columns: [
			{% for col in columns %}
			{% if col[0] != 'rid' %}
			{ field: {{ col[0] | tojson }}, title: {{ col[1] | tojson }}, align: 'center', sortable: true, visible: {{ (col[2] == '1') | tojson }}, formatter: formatYesNo },
			{% endif %}
			{% endfor %}
			]
		});

		$('#delButton').click(function ()
		{
			var ids = table.selectedIds('appID');

			var formData = new FormData();
			formData.append("appID", ids);
			$.ajax({
				type:'DELETE',
				url: '/osmanage/app_filter/delete',
				data: formData,
				cache: false,
				processData: false,
				contentType: false,
				success: function(){
					alert("Software restriction deleted successfully");
					$('#modalDialog').modal('hide');
					table.refresh();
				},
				error: function(jqXHR, textStatus, errorThrown){
					alert("Failed to delete software restriction.");
					$('#modalDialog').modal('hide');
				}
			});
			return true;
		});

		$('#addButton').click(function ()
		{
			resetModalWindow();
			$.get("/osmanage/app_filter/add").done(function(data)
			{
				$('#modalTitle').html('Software Restriction');
				$('#modalCancelButton').html('Cancel');
				$('#modalBody').html(data);
				$('#modalDialog').addClass("modal-wide");
				$('#modalDialog').modal('show');

				$("#modalDialog").on("hidden.bs.modal", function () {
					table.refresh();
					$(".mySWResForm").html("");
				});
			});
		});
	});
	</script>
{% endblock %}
