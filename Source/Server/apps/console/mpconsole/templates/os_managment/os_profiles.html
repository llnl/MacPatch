{% extends "base.html" %}

{% block styles %}
	{{ super() }}
	<link href="{{ url_for('static', filename='yarn_components/bootstrap-table/dist/bootstrap-table.css') }}" rel="stylesheet">
	<link href="{{ url_for('static', filename='css/mp.css') }}" rel="stylesheet">

{%  endblock %}

{% block pageHeader %}
	OS Profiles
{%  endblock %}

{% block bodyPanel %}

	<div id="toolbar">
		{% if session.role[0] == 1 %}
		<button id="addButton" type="button" class="btn btn-default"><i class="glyphicon glyphicon-plus"></i></button>
		<button id="delButton" type="button" class="btn btn-default"><i class="glyphicon glyphicon-trash"></i></button>
		{% endif %}
	</div>
	<table id="table" class="table table-bordered table-sm table-striped"></table>

{% endblock %}


{% block javascript %}
	{{ super() }}
	<script src="{{ url_for('static', filename='yarn_components/bootstrap-table/dist/bootstrap-table.min.js') }}"></script>
	<script>
	$( document ).ready(function()
	{
		var isAdmin = {{ (session.role[0] == 1) | tojson }};

		var table = MPTable.create('#table', {
			url: "/osmanage/profiles/list",
			toolbar: '#toolbar',
			showRefresh: true,
			pageList: ['10', '25', '50', '100', 'All'],
			idField: 'profileID',
			checkbox: isAdmin,
			size: 'lg',
			actions: [
				{ name: 'edit',
				  icon: isAdmin ? 'fa-pencil' : 'fa-search',
				  title: isAdmin ? 'Edit Profile' : 'Profile Data',
				  onClick: function (row) {
					WizardNavigation.open("/osmanage/profiles/update/" + encodeURIComponent(row['profileID']));
				  } },
				{ name: 'download', icon: 'fa-download', title: 'Download Profile',
				  onClick: function (row) {
					var _fileName = row['profileName'].replace(/\s/g,'') + '.mobileconfig';
					var _url = '/osmanage/profile/download/' + encodeURIComponent(row['profileID']);
					var req = new XMLHttpRequest();
					req.open("GET", _url, true);
					req.responseType = "blob";
					req.onload = function () {
						var link = document.createElement('a');
						link.href = window.URL.createObjectURL(req.response);
						link.download = _fileName;
						link.click();
					};
					req.send();
				  } }
			],
			columns: [
			{% for col in columns %}
			{ field: {{ col[0] | tojson }}, title: {{ col[1] | tojson }}{% if col[0] == 'profileID' or col[2] == '0' %}, visible: false{% endif %}, sortable: true },
			{% endfor %}
			],
			data: [
				{% for d in data %}
				{
					{% for col in columns %}
					{{ col[0] | tojson }}: {{ d[col[0]] | string | tojson }},
					{% endfor %}
				},
				{% endfor %}
			]
		});

		$('#delButton').click(function ()
		{
			var ids = table.selectedIds('profileID');

			var formData = new FormData();
			formData.append("profileID", ids);
			$.ajax({
				type:'DELETE',
				url: '/osmanage/profile/delete',
				data: formData,
				cache: false,
				processData: false,
				contentType: false,
				success: function(){
					alert("OS Profile Deleted Successfully");
					$('#modalDialog').modal('hide');
					table.removeRows('profileID', ids);
				},
				error: function(jqXHR, textStatus, errorThrown){
					alert("OS Profile Failed to Delete");
					$('#modalDialog').modal('hide');
				}
			});
			return true;
		});

		$('#addButton').click(function ()
		{
			WizardNavigation.open("/osmanage/profiles/add");
		});
	});
	</script>
{% endblock %}
