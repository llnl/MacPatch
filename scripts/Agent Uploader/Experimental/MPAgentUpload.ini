# MPAgentUploader Configuration File
# -----------------------------------------------------------------------
# Pass this file to the script with: MPAgentUploader_exp.py -c this_file.ini
#
# All values are optional — only set what you want to override from the
# built-in defaults. CLI arguments always take precedence over values
# set here.
#
# NOTE: Do NOT store credentials (api_usr_name, api_usr_pass) in this
# file. Credentials are intentionally blocked from file-based config and
# must be supplied interactively (-u) or via the environment.
# -----------------------------------------------------------------------

[DEFAULT]

# ---------------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------------

# Hostname or IP of the MacPatch Master/Primary server (required)
mp_server = macpatch.example.com

# API port (default: 3600)
mp_port = 3600

# Use HTTPS for API calls. Set to false only in isolated dev environments.
# (default: true)
use_ssl = true

# Verify SSL certificates. Set to false if using self-signed certificates.
# Equivalent to passing --no-verify-ssl on the CLI.
# (default: true)
verify_ssl = true

# API URI prefix (default: /api/v1)
uri_prefix = /api/v1

# ---------------------------------------------------------------------------
# Package paths
# ---------------------------------------------------------------------------

# Full path to the agent package zip produced by MPClientBuild (required)
agent_package_path = /path/to/MacPatch.pkg.zip

# Base directory where processed packages are written.
# A timestamped subdirectory (e.g. Completed/MacPatch_20240101120000) is
# created inside this path.
pkg_dest_dir = /path/to/output

# ---------------------------------------------------------------------------
# Package options
# ---------------------------------------------------------------------------

# Upload finished packages to the server after processing.
# Set to false to build locally without uploading (default: true)
upload_pkgs = true

# Path to a directory containing .bundle plugin files to embed in the package.
# Leave commented out if you have no plugins.
# plugins_directory = /path/to/Plugins

# Agent registration key to embed in the package.
# Leave commented out if registration keys are not used.
# registration_key = YOUR-REGISTRATION-KEY

# Path to a migration.plist to include in the Updater package.
# Only needed when migrating from an older MacPatch server version.
# migration_plist = /path/to/migration.plist

# ---------------------------------------------------------------------------
# Code signing
# ---------------------------------------------------------------------------

# Sign the flattened packages with productsign. (default: true)
sign_pkg = true

# The signing identity string as it appears in Keychain Access.
# Run: security find-identity -v -p codesigning   to list valid identities.
sign_identity = Developer ID Installer: Example Org (XXXXXXXXXX)

# ---------------------------------------------------------------------------
# Notarization
# ---------------------------------------------------------------------------

# Submit packages to Apple for notarization. (default: true)
notorize = true

# Notarization tool to use:
#   notarytool  — xcrun notarytool  (Xcode 15+, recommended)
#   altool      — xcrun altool      (legacy, Xcode < 15, deprecated)
# (default: notarytool)
notarize_tool = notarytool

# Apple Developer account email address
dev_account = developer@example.com

# 10-digit Apple Developer Team ID
# Found at: https://developer.apple.com/account -> Membership -> Team ID
dev_team = XXXXXXXXXX

# Label of the Keychain item that holds your app-specific password.
# Create one at: https://appleid.apple.com -> App-Specific Passwords
dev_keychain_label = macpatch-notarization

# App-specific password for notarization.
# Prefer dev_keychain_label above to avoid storing passwords in plain text.
# apple_id_app_password = xxxx-xxxx-xxxx-xxxx